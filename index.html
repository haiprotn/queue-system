<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Gọi Số - Phòng Khám</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c1426, #1a2744, #0f2027);
            display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none;
        }
        .container { text-align: center; position: relative; z-index: 1; padding: 2rem; }
        .logo { width: 80px; height: 80px; margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; box-shadow: 0 10px 40px rgba(0,210,255,.3);
        }
        h1 { font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, #fff, #a8d8ea);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .sub { color: rgba(255,255,255,.5); font-size: .95rem; margin-bottom: 3rem; font-weight: 300; }
        .cards { display: flex; flex-direction: column; gap: 1rem; max-width: 400px; margin: 0 auto; }
        .card {
            display: flex; align-items: center; gap: 1.2rem;
            padding: 1.3rem 1.5rem; border-radius: 16px; text-decoration: none; color: #fff;
            transition: all .3s; border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(10px);
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,.3); }
        .card-staff { background: linear-gradient(135deg, rgba(255,154,0,.15), rgba(255,100,50,.15)); }
        .card-staff:hover { border-color: rgba(255,154,0,.4); background: linear-gradient(135deg, rgba(255,154,0,.25), rgba(255,100,50,.25)); }
        .card-display { background: linear-gradient(135deg, rgba(0,230,118,.15), rgba(0,180,100,.15)); }
        .card-display:hover { border-color: rgba(0,230,118,.4); background: linear-gradient(135deg, rgba(0,230,118,.25), rgba(0,180,100,.25)); }
        .card-icon {
            width: 52px; height: 52px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .card-staff .card-icon { background: rgba(255,154,0,.2); }
        .card-display .card-icon { background: rgba(0,230,118,.2); }
        .card-text h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: .2rem; }
        .card-text p { font-size: .8rem; color: rgba(255,255,255,.5); font-weight: 300; }
        .arrow { margin-left: auto; font-size: 1.2rem; opacity: .3; transition: all .3s; }
        .card:hover .arrow { opacity: .8; transform: translateX(4px); }
        .footer { margin-top: 3rem; font-size: .75rem; color: rgba(255,255,255,.25); }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="container">
        <div class="logo">🏥</div>
        <h1>Phòng Khám</h1>
        <p class="sub">Hệ thống gọi số thứ tự</p>
        <div class="cards">
            <a href="/staff" class="card card-staff">
                <div class="card-icon">👨‍⚕️</div>
                <div class="card-text">
                    <h3>Nhân Viên</h3>
                    <p>Bấm gọi số thứ tự</p>
                </div>
                <span class="arrow">→</span>
            </a>
            <a href="/display" class="card card-display">
                <div class="card-icon">📺</div>
                <div class="card-text">
                    <h3>Màn Hình Hiển Thị</h3>
                    <p>Hiển thị số đang gọi + âm thanh</p>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>
        <p class="footer">Raspberry Pi 3 • Kết nối cùng mạng WiFi</p>
    </div>
</body>
</html>
